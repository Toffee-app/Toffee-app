<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOFFEE Prototype — Fee4</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#111;font-family:Arial,"Noto Sans Thai",sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:min(94vw,520px);aspect-ratio:941/1672;background:#fff;overflow:hidden;box-shadow:0 20px 60px #0008}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}
.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}.todayMaster{object-fit:contain!important;background:#a1ccf0}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer}
.toast{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);background:#fff;color:#174eb7;border-radius:999px;padding:10px 18px;font-size:16px;box-shadow:0 5px 20px #0003;display:none;z-index:20}
.overlay{position:absolute;inset:0;background:#0004;display:none;z-index:30}
.modal{position:absolute;left:7%;right:7%;top:25%;background:white;border-radius:24px;padding:22px;box-shadow:0 20px 50px #0005}
.modal h2{margin:0 0 14px;color:#174eb7;font-size:24px}
.modal input{width:100%;padding:14px;border:1px solid #ccd9ef;border-radius:14px;font-size:18px}
.modal button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:14px;background:#238df0;color:#fff;font-size:18px}
.reminder-list{display:flex;flex-direction:column;gap:10px}
.reminder-item{display:flex;gap:10px;align-items:center;font-size:17px}
.reminder-item input{width:20px;height:20px}
.timerOverlay{position:absolute;inset:0;pointer-events:none;z-index:10}
.timerNumber{position:absolute;left:50%;top:25.8%;transform:translate(-50%,-50%);font-size:58px;line-height:1;font-weight:700;color:#1764d8;letter-spacing:-2px;text-shadow:0 1px 2px #0001;white-space:nowrap}
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#8fc7f5"><script src="toffee-data.js"></script></head>
<body>
<div class="phone">

  <section id="home" class="screen active">
    <img src="assets/home.png" alt="">
    <button class="hotspot" style="left:77%;top:2.5%;width:20%;height:11.5%" onclick="showToday()"></button>
    <button class="hotspot" style="left:81%;top:12.8%;width:11%;height:6%" onclick="showTomorrow()"></button>

    <button class="hotspot" style="left:5%;top:42.5%;width:90%;height:5.0%" onclick="openFocus('ทำสินค้า Etsy')"></button>
    <button class="hotspot" style="left:5%;top:47.4%;width:90%;height:5.0%" onclick="openFocus('งานลูกค้า')"></button>
    <button class="hotspot" style="left:5%;top:52.3%;width:90%;height:5.0%" onclick="openFocus('งานสอน')"></button>
    <button class="hotspot" style="left:5%;top:57.3%;width:90%;height:5.0%" onclick="openFocus('ทำ YouTube')"></button>
    <button class="hotspot" style="left:5%;top:62.3%;width:90%;height:5.0%" onclick="openFocus('ขยับร่างกาย')"></button>
    <button class="hotspot" style="left:5%;top:67.7%;width:90%;height:5.0%" onclick="addTask()"></button>

    <button class="hotspot" style="left:4%;top:73.5%;width:22%;height:13%" onclick="showMigraine()"></button>
    <button class="hotspot" style="left:27%;top:73.5%;width:22%;height:13%" onclick="showMood()"></button>
    <button class="hotspot" style="left:50%;top:73.5%;width:22%;height:13%" onclick="showMoney()"></button>
    <button class="hotspot" style="left:74%;top:73.5%;width:22%;height:13%" onclick="showRest()"></button>
  </section>

  <section id="focus" class="screen">
    <img src="assets/focus_runtime.png" alt="">
    <button class="hotspot" style="left:2%;top:5%;width:15%;height:7%" onclick="goHome()"></button>
    <button class="hotspot" style="left:39%;top:27%;width:22%;height:7%" onclick="startTimer()"></button>
    <button class="hotspot" style="left:35%;top:34%;width:12%;height:5%" onclick="setTimer(5)"></button>
    <button class="hotspot" style="left:47%;top:34%;width:12%;height:5%" onclick="setTimer(15)"></button>
    <button class="hotspot" style="left:59%;top:34%;width:12%;height:5%" onclick="setTimer(30)"></button>
    <button class="hotspot" style="left:71%;top:34%;width:12%;height:5%" onclick="setTimer(60)"></button>
    <button class="hotspot" style="left:40%;top:35%;width:20%;height:9%" onclick="startTimer()"></button>
    <div id="timerNumber" class="timerNumber"></div>
  </section>

  <section id="done" class="screen">
    <img src="assets/done.png" alt="">
    <button class="hotspot" style="left:10%;bottom:5%;width:80%;height:10%" onclick="goHome()"></button>
  </section>

  <section id="rest" class="screen">
    <img src="assets/rest.png" alt="">
    <button class="hotspot" style="left:4%;top:4%;width:16%;height:7%" onclick="goHome()"></button>
    <button class="hotspot" style="left:32%;top:38%;width:36%;height:18%" onclick="startRest()"></button>
  </section>

  <section id="restDone" class="screen">
    <img src="assets/rest_done.png" alt="">
    <button class="hotspot" style="left:3%;top:4%;width:15%;height:7%" onclick="goHome()"></button>
    <button class="hotspot" style="left:10%;bottom:12%;width:80%;height:9%" onclick="goHome()"></button>
    <button class="hotspot" style="left:10%;bottom:4%;width:80%;height:7%" onclick="startRest()"></button>
  </section>

  <section id="migraine" class="screen">
    <img src="assets/migraine.png" alt="">
    <button class="hotspot" style="left:3%;top:4%;width:15%;height:7%" onclick="goHome()"></button>
  </section>

  <section id="mood" class="screen">
    <img src="assets/mood.png" alt="">
    <button class="hotspot" style="left:3%;top:4%;width:15%;height:7%" onclick="goHome()"></button>
    <button class="hotspot" style="left:8%;top:35%;width:84%;height:10%" onclick="moodSaved()"></button>
    <button class="hotspot" style="left:8%;top:46%;width:84%;height:10%" onclick="moodSaved()"></button>
    <button class="hotspot" style="left:8%;top:57%;width:84%;height:10%" onclick="moodSaved()"></button>
    <button class="hotspot" style="left:8%;top:68%;width:84%;height:10%" onclick="moodSaved()"></button>
  </section>

  <section id="money" class="screen">
    <img src="assets/money.png" alt="">
    <button class="hotspot" style="left:3%;top:4%;width:15%;height:7%" onclick="goHome()"></button>
    <button class="hotspot" style="left:10%;bottom:6%;width:80%;height:9%" onclick="addMoney()"></button>
  </section>

  <section id="tomorrow" class="screen">
    <img src="assets/tomorrow.png" alt="">
    <button class="hotspot" style="left:3%;top:4%;width:15%;height:7%" onclick="goHome()"></button>
    <button class="hotspot" style="left:20%;bottom:3%;width:60%;height:12%" onclick="addTomorrow()"></button>
  </section>

  <section id="today" class="screen">
    <img class="todayMaster" src="assets/today.png" alt="">
    <button class="hotspot" style="left:3%;top:4%;width:15%;height:7%" onclick="goHome()"></button>
    <div id="todayList" style="position:absolute;left:9%;right:9%;top:30%;bottom:13%;display:flex;flex-direction:column;gap:10px;z-index:5"></div>
  </section>

  <div id="toast" class="toast"></div>
  <div id="modalOverlay" class="overlay">
    <div class="modal">
      <h2 id="modalTitle">เพิ่มรายการ</h2>
      <input id="modalInput" autocomplete="off">
      <button onclick="saveModal()">บันทึก</button>
    </div>
  </div>
</div>

<script>
let currentTask='ทำสินค้า Etsy', timer=null, remaining=3600, tomorrowItems=JSON.parse(localStorage.getItem('toffeeTomorrow')||'[]');
const $=id=>document.getElementById(id);
function showScreen(id){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  $(id).classList.add('active');
}
function goHome(){showScreen('home')}
function openFocus(task){currentTask=task;remaining=3600;updateTimer();showScreen('focus')}
function addTask(){const n=prompt('ชื่องานใหม่');if(n){openFocus(n)}}
function showToday(){renderToday();showScreen('today')}
function showTomorrow(){renderTomorrow();showScreen('tomorrow')}
function showMood(){showScreen('mood')}
function showMigraine(){showScreen('migraine')}
function showMoney(){showScreen('money')}
function showRest(){showScreen('rest')}
function renderTomorrow(){}
function renderToday(){
 const list=$('todayList'); list.innerHTML='';
 const items=JSON.parse(localStorage.getItem('toffeeToday')||'[]');
 if(!items.length){list.innerHTML='<div style="text-align:center;color:#6b8bbd;font-size:18px;margin-top:35px">ยังไม่มีรายการวันนี้</div>';return}
 items.forEach((x,i)=>{
   const row=document.createElement('label');row.className='reminder-item';
   row.style.cssText='background:#fffdf9;border-radius:14px;padding:11px 13px;box-shadow:0 2px 8px #00000012;color:#172c55';
   row.innerHTML='<input type="checkbox"> <span></span>';row.querySelector('span').textContent=x;
   row.querySelector('input').onchange=()=>{if(row.querySelector('input').checked){row.style.opacity='.45';localStorage.setItem('toffeeToday',JSON.stringify(items.filter((_,j)=>j!==i)))}};
   list.appendChild(row);
 })
}
function addTomorrow(){
 const v=prompt('พรุ่งนี้อย่าลืมอะไร?'); if(!v)return;
 tomorrowItems.push(v);localStorage.setItem('toffeeTomorrow',JSON.stringify(tomorrowItems));toast('บันทึกไว้สำหรับพรุ่งนี้แล้ว');renderTomorrow()
}
function moodSaved(){toast('บันทึกความรู้สึกแล้ว');setTimeout(goHome,900)}
function addMoney(){toast('ปุ่มเพิ่มรายการพร้อมเชื่อมต่อในขั้นถัดไป')}
function setTimer(min){remaining=min*60;updateTimer()}
function updateTimer(){$('timerNumber').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')}
function startTimer(){
 if(timer)return;
 timer=setInterval(()=>{remaining--;updateTimer();if(remaining<=0){clearInterval(timer);timer=null;showScreen('done')}},1000)
}
function startRest(){
  let r=300;
  showScreen('rest');
  const id=setInterval(()=>{
    r--;
    if(r<=0){
      clearInterval(id);
      showScreen('restDone');
    }
  },1000);
}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1400)}
function saveModal(){}
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js")}</script></body>
</html>
